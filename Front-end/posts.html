<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Posts · AscensionCleanics</title>
    <meta
      name="description"
      content="Every cleanup posted to AscensionCleanics, newest first."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-auth="out">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="nav container" aria-label="Main">
        <a class="brand" href="homepage.html">
          <img
            class="brand-logo"
            src="assets/asnBlackLogo.png"
            alt=""
            width="40"
            height="40"
          />
          AscensionCleanics
        </a>
        <ul class="nav-links">
          <li><a href="homepage.html">Home</a></li>
          <li><a href="submit.html">Submit</a></li>
          <li><a href="posts.html" aria-current="page">Posts</a></li>
          <li><a href="tasks.html">Tasks</a></li>
          <li id="admin-link" hidden><a href="admin.html">Admin</a></li>
        </ul>
        <div class="nav-auth">
          <span id="user-name" class="user-name" hidden></span>
          <a id="auth-btn" class="btn btn-ghost" href="api/auth/login">Sign in</a>
        </div>
      </nav>
    </header>

    <main id="main" class="container posts-page">
      <h1 class="page-title">Posts</h1>
      <p class="lead">Every cleanup in the lab, newest first.</p>

      <!-- Filled by the page script with one <article class="sub-card post"> per submission,
           sorted by cleaned_on date, newest first. The paragraph below shows until there's data. -->
      <div id="posts" class="post-grid">
        <p class="empty-state">No posts yet. <a href="submit.html">Submit a cleanup</a> to post the first one.</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span class="brand brand-small">
          <img
            class="brand-logo brand-logo-small"
            src="assets/asnBlackLogo.png"
            alt=""
            width="28"
            height="28"
          />
          AscensionCleanics
        </span>
        <p>Built at Hackcamp to keep our design lab usable for everyone.</p>
      </div>
    </footer>

    <script src="auth.js"></script>

    <!-- Back end: add your scripts here. Hooks used by this page:
       #posts, #auth-btn, #user-name, #admin-link.
       Sign-in state: set <body data-auth="in"> for signed-in users, "out" otherwise.
       That shows .auth-in-only (like button, comment form) or .auth-out-only (sign-in links).
       The server must still reject likes/comments from signed-out users. Hiding the form is not enough. -->

       <script>
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str || "";
        return div.innerHTML;
      }

      function formatFullDate(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        if (isNaN(d)) return escapeHtml(dateStr);
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      }

      async function initPostsPage() {
        const authBtn = document.getElementById("auth-btn");
        const userNameEl = document.getElementById("user-name");

        // 1. Check Auth Status
        try {
          const authRes = await fetch("/api/auth/user", { credentials: "include" });
          if (authRes.ok) {
            const { user } = await authRes.json();
            document.body.dataset.auth = "in";
            userNameEl.textContent = user.name || user.email;
            userNameEl.hidden = false;
            authBtn.textContent = "Sign out";
            authBtn.href = "#";
            authBtn.onclick = async (e) => {
              e.preventDefault();
              await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
              window.location.reload();
            };
          } else {
            document.body.dataset.auth = "out";
            authBtn.href = "/api/auth/login";
          }
        } catch (e) {
          document.body.dataset.auth = "out";
          authBtn.href = "/api/auth/login";
        }

        // 2. Fetch and Render Posts
        const postsContainer = document.getElementById("posts");
        try {
          const res = await fetch("/api/posts", { credentials: "include" });
          if (!res.ok) return;
          const { data } = await res.json();

          if (data && data.length > 0) {
            const uploadedHtml = data.map((post) => {
              const commentsCount = post.comments ? post.comments.length : 0;
              const commentLabel = commentsCount === 1 ? "1 comment" : `${commentsCount} comments`;
              const commentsListHtml = commentsCount > 0
                ? `<ul class="comment-list">
                    ${post.comments.map((c) => `
                      <li class="comment">
                        <p class="comment-meta"><strong>${escapeHtml(c.user_name)}</strong><time datetime="${escapeHtml(c.created_at)}">${escapeHtml(c.created_at)}</time></p>
                        <p class="comment-text">${escapeHtml(c.body)}</p>
                      </li>
                    `).join("")}
                   </ul>`
                : `<p class="comment-empty">No comments yet.</p>`;

              return `
                <article class="sub-card post">
                  <div class="ba-pair">
                    <figure>
                      <img src="${escapeHtml(post.before_image_url)}" alt="Before cleaning by ${escapeHtml(post.user_name)}" />
                      <figcaption>Before</figcaption>
                    </figure>
                    <figure>
                      <img src="${escapeHtml(post.after_image_url)}" alt="After cleaning by ${escapeHtml(post.user_name)}" />
                      <figcaption>After</figcaption>
                    </figure>
                  </div>
                  <p class="post-desc">${escapeHtml(post.description)}</p>
                  <p class="sub-meta">
                    <strong>${escapeHtml(post.user_name)}</strong>
                    <time datetime="${escapeHtml(post.cleaned_on)}">${formatFullDate(post.cleaned_on)}</time>
                  </p>
                  <div class="post-social">
                    <button class="like-btn auth-in-only" type="button" data-post-id="${post.id}" aria-pressed="${post.liked_by_me ? "true" : "false"}">
                      <svg class="like-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.5h2c.7-1.4 2.2-2.5 4.3-2.5 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
                      <span class="like-count">${post.like_count || 0}</span>
                      <span class="visually-hidden"> likes, like this post</span>
                    </button>
                    <a class="like-btn auth-out-only" href="/api/auth/login" title="Sign in to like">
                      <svg class="like-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.5h2c.7-1.4 2.2-2.5 4.3-2.5 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
                      <span class="like-count">${post.like_count || 0}</span>
                      <span class="visually-hidden"> likes, sign in to like this post</span>
                    </a>
                    <details class="comments">
                      <summary>${commentLabel}</summary>
                      <div class="comments-body">
                        ${commentsListHtml}
                        <form class="comment-form auth-in-only" data-post-id="${post.id}">
                          <label class="visually-hidden" for="comment-${post.id}">Write a comment</label>
                          <textarea id="comment-${post.id}" name="body" rows="2" maxlength="300" required placeholder="Write a comment"></textarea>
                          <button class="btn btn-primary" type="submit">Post comment</button>
                        </form>
                        <p class="comment-signin auth-out-only"><a href="/api/auth/login">Sign in</a> to comment.</p>
                      </div>
                    </details>
                  </div>
                  <div class="post-admin admin-only">
                    <button class="btn btn-danger post-delete" type="button" data-post-id="${post.id}">
                      Delete post<span class="visually-hidden"> by ${escapeHtml(post.user_name)}</span>
                    </button>
                  </div>
                </article>
              `;
            }).join("");

            // Replace the "No posts yet" message with the real posts
            postsContainer.innerHTML = uploadedHtml;
          }
        } catch (e) {
          console.error("Error loading posts:", e);
        }

        // 3. Handle Like Button Clicks
        postsContainer.addEventListener("click", async (e) => {
          const btn = e.target.closest("button.like-btn[data-post-id]");
          if (!btn) return;
          const postId = btn.dataset.postId;
          const res = await fetch(`/api/posts/${postId}/like`, {
            method: "POST",
            credentials: "include",
          });
          if (res.ok) {
            const { liked, like_count } = await res.json();
            btn.setAttribute("aria-pressed", liked ? "true" : "false");
            btn.querySelector(".like-count").textContent = like_count;
          }
        });

        // 3b. Admins: delete a post (POST /api/posts/{id}/delete; the server must check the user is an admin)
        postsContainer.addEventListener("click", async (e) => {
          const btn = e.target.closest("button.post-delete[data-post-id]");
          if (!btn) return;
          const card = btn.closest("article.post");
          const author = card?.querySelector(".sub-meta strong")?.textContent || "this person";
          if (!confirm(`Delete this post by ${author}? Its photos, likes and comments will be removed. This can't be undone.`)) return;

          btn.disabled = true;
          try {
            const res = await fetch(`/api/posts/${btn.dataset.postId}/delete`, {
              method: "POST",
              credentials: "include",
              headers: { Accept: "application/json" },
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              alert(err.message || err.error || "Couldn't delete the post. Try again.");
              btn.disabled = false;
              return;
            }
            card.remove();
            if (!postsContainer.querySelector("article.post")) {
              postsContainer.innerHTML = '<p class="empty-state">No posts yet. <a href="submit.html">Submit a cleanup</a> to post the first one.</p>';
            }
          } catch (err) {
            alert("Network error while deleting the post.");
            btn.disabled = false;
          }
        });

        // 4. Handle Comment Form Submissions
        postsContainer.addEventListener("submit", async (e) => {
          const form = e.target.closest("form.comment-form[data-post-id]");
          if (!form) return;
          e.preventDefault();
          const postId = form.dataset.postId;
          const textarea = form.querySelector("textarea");
          const body = textarea.value.trim();
          if (!body) return;

          const res = await fetch(`/api/posts/${postId}/comments`, {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({ body }),
          });
          if (res.ok) {
            window.location.reload();
          }
        });
      }

      initPostsPage();
    </script>
  </body>
</html>
