<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HackCamp &middot; Flask + JS</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="header">
    <h1>HackCamp</h1>
    <p class="subtitle">Flask backend &middot; HTML5/JS frontend</p>
    <span id="status" class="status status--pending" role="status">Connecting&hellip;</span>
  </header>

  <main class="main">
    <section class="card">
      <h2>1. GET request</h2>
      <p class="hint">Calls <code>GET /api/greeting</code> with a query parameter.</p>
      <form id="greeting-form" class="form">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" placeholder="Ada Lovelace" autocomplete="name" />
        <button type="submit">Say hello</button>
      </form>
      <p id="greeting-output" class="output" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>2. POST request</h2>
      <p class="hint">Sends JSON to <code>POST /api/echo</code> and shows what came back.</p>
      <form id="echo-form" class="form">
        <label for="echo-message">Message</label>
        <input id="echo-message" name="message" type="text" placeholder="Hello from the browser" required />
        <button type="submit">Echo it</button>
      </form>
      <pre id="echo-output" class="output output--pre" aria-live="polite"></pre>
    </section>
  </main>

  <footer class="footer">
    <p>Edit <code>backend/routes/api.py</code> to add endpoints, and <code>frontend/js/app.js</code> to use them.</p>
  </footer>
</body>
</html>
